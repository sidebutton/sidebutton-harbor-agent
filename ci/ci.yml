# CI workflow for sidebutton-harbor-agent.
#
# ACTIVATION (one-time, needs a token with the GitHub `workflow` scope):
#   move this file to `.github/workflows/ci.yml`.
# The automation account that opened the adapter PR has only the `repo` scope,
# which GitHub forbids from creating files under `.github/workflows/`, so the
# workflow is parked here. Its content is final — no edits needed on move.
#
# OPTIONAL SECRETS (the `packs` job below):
#   SB_PACK_REPO_TOKEN — read credential for the private account pack repo.
#   SB_PACK_REPO_URL   — its https clone URL. REQUIRED whenever the token is set:
#                        the drift guard refuses to send a credential to the URL
#                        recorded in packs/EXPORT.json, since that file is
#                        repo-controlled and a PR could redirect the secret.
# Both unset is a supported configuration: the drift guard then runs its
# credential-less mode. Setting both upgrades it to the full re-export diff.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Unit tests (pytest, no container)
        run: python -m pytest -q

      - name: Dry-run entrypoint smoke (AC2)
        run: |
          sidebutton-harbor-agent-dryrun \
            --model anthropic/claude-opus-4-8 --effort high

  # Drift guard: the bundled packs/ must still be a clean export of the pack-repo
  # commit recorded in packs/EXPORT.json. The private-repo fetch is credential-
  # gated, so this degrades to manifest-consistency validation when the secret is
  # absent — which is the default for forks and for PRs from a fork.
  packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Pack export drift guard
        env:
          SB_PACK_REPO_URL: ${{ secrets.SB_PACK_REPO_URL }}
          SB_PACK_REPO_TOKEN: ${{ secrets.SB_PACK_REPO_TOKEN }}
        run: |
          if [ -n "$SB_PACK_REPO_TOKEN" ] && [ -z "$SB_PACK_REPO_URL" ]; then
            echo "SB_PACK_REPO_TOKEN is set but SB_PACK_REPO_URL is not — the guard"
            echo "will not send a credential to a URL read out of packs/EXPORT.json."
            exit 1
          elif [ -n "$SB_PACK_REPO_TOKEN" ]; then
            echo "read credential configured -> full drift check (re-export at the recorded commit)"
            sidebutton-harbor-agent-check-packs --fetch
          else
            echo "no SB_PACK_REPO_TOKEN configured -> offline manifest-consistency validation"
            sidebutton-harbor-agent-check-packs
          fi
